<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!-- AIBRAIN app icon · "Constellation" (amber): topic list on a column of
       connected memory nodes, active node lit and recalling. -->
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242934"/><stop offset="1" stop-color="#0d0f13"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffcd87"/><stop offset="1" stop-color="#ef9636"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".12"/><stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tile"><rect width="100" height="100" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="100" height="100" fill="url(#ink)"/>
    <rect width="100" height="100" fill="url(#gloss)"/>
    <g stroke="url(#amber)" stroke-width="2" opacity=".42" stroke-linecap="round">
      <line x1="30" y1="36" x2="30" y2="52"/>
      <line x1="30" y1="36" x2="18" y2="24"/>
      <line x1="30" y1="36" x2="17" y2="46"/>
      <line x1="30" y1="52" x2="30" y2="68"/>
    </g>
    <rect x="40" y="32.3" width="36" height="7.4" rx="3.7" fill="url(#amber)"/>
    <rect x="40" y="48.3" width="28" height="7.4" rx="3.7" fill="url(#amber)" opacity=".5"/>
    <rect x="40" y="64.3" width="32" height="7.4" rx="3.7" fill="url(#amber)" opacity=".5"/>
    <circle cx="18" cy="24" r="2.4" fill="url(#amber)" opacity=".7"/>
    <circle cx="17" cy="46" r="2.1" fill="url(#amber)" opacity=".55"/>
    <circle cx="30" cy="52" r="3.6" fill="url(#amber)" opacity=".5"/>
    <circle cx="30" cy="68" r="3.6" fill="url(#amber)" opacity=".5"/>
    <circle cx="30" cy="36" r="7.4" fill="none" stroke="url(#amber)" stroke-width="1.6" opacity=".3"/>
    <circle cx="30" cy="36" r="4.8" fill="url(#amber)"/>
  </g>
</svg>
